jules_ai:
  image: valorg/ai-jules:1.0
  env:
    NETWORK: "valorchain-g-main"
    GENESIS_CONTRACT: "0xGENESISANCHORADDR"
    TIME_TOKEN: "0xTIMETOKENADDR"
    CONTROLLER: "0xDONADAMS"
  services:
    - anchor-service
    - verifier-service
    - ipfs-uploader
    - signer-daemon
  keys:
    - name: jules_main_key
      type: secp256k1
      permissions: [anchor, mint, attest]